# yaml is yet another markup language
flappybirdv0:
  env_id: FlappyBird-v0
  epsilon_init: 1
  epsilon_min: 0.05
  epsilon_decay: 0.9995
  replay_memory_size: 100000
  mini_batch_size: 32
  network_sync_rate: 10     #at each 10th interval, policy network will sync with target network while training
  alpha: 0.001
  gamma: 0.99
  reward_threshold: 1000